<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Iga EdTech</title>
  <link rel="stylesheet" href="../css/shared-auth.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="auth-body">
  <div class="auth-left">
    <div class="illustration-box">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
        <div style="font-size:80px;">🔐</div>
        <div style="font-size:15px;color:#475569;font-weight:500;">Reset your password securely</div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    
    <div id="step-email" style="display:flex;flex-direction:column;align-items:center;width:100%;">
      <div class="form-title">Forgot your password?</div>
      <p style="font-size:15px;color:#475569;max-width:420px;text-align:center;margin-bottom:24px;line-height:1.7;">
        Enter your email and we'll send you a reset code.
      </p>
      <form id="forgotForm" novalidate style="display:flex;flex-direction:column;align-items:center;width:100%;">
        <input class="input-field" type="email" id="email" placeholder="Email" required/>
        <div id="emailError" class="field-error hidden"></div>
        <button type="submit" class="btn-submit" id="sendBtn">Send Reset Code</button>
      </form>
      <div class="switch-box">Remember your password? <a href="login.html">Log in</a></div>
    </div>

   
    <div id="step-reset" class="hidden" style="display:flex;flex-direction:column;align-items:center;width:100%;">
      <div class="form-title">Enter your reset code</div>
      <p style="font-size:15px;color:#475569;max-width:420px;text-align:center;margin-bottom:24px;line-height:1.7;">
        Check your email for the 6-digit code.
      </p>
      <form id="resetForm" novalidate style="display:flex;flex-direction:column;align-items:center;width:100%;">
        <input type="text" class="otp-input" id="otpCode" placeholder="000000" maxlength="6"/>
        <div id="codeError" class="field-error hidden" style="text-align:center;"></div>
        <input class="input-field" type="password" id="newPass"     placeholder="New Password"/>
        <input class="input-field" type="password" id="confirmPass" placeholder="Confirm Password"/>
        <div id="passError" class="field-error hidden"></div>
        <button type="submit" class="btn-submit" id="resetBtn">Reset Password</button>
      </form>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="../js/api.js"></script>
<script src="../js/components.js"></script>
<script>
  let resetEmail = '';

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('sendBtn');
    const email = document.getElementById('email');
    if (!email.value.trim()) { document.getElementById('emailError').textContent='Email is required.'; document.getElementById('emailError').classList.remove('hidden'); return; }
    setLoading(btn, true);
    await AuthAPI.forgotPassword({ email: email.value.trim() });
    setLoading(btn, false);
    resetEmail = email.value.trim();
    document.getElementById('step-email').classList.add('hidden');
    document.getElementById('step-reset').classList.remove('hidden');
    showToast('If that email exists, a code has been sent.', 'info');
  });

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn     = document.getElementById('resetBtn');
    const code    = document.getElementById('otpCode').value.trim();
    const newPass = document.getElementById('newPass').value;
    const confirm = document.getElementById('confirmPass').value;
    ['codeError','passError'].forEach(id => document.getElementById(id).classList.add('hidden'));
    if (code.length !== 6) { document.getElementById('codeError').textContent='Enter the 6-digit code.'; document.getElementById('codeError').classList.remove('hidden'); return; }
    if (!newPass)          { document.getElementById('passError').textContent='New password is required.'; document.getElementById('passError').classList.remove('hidden'); return; }
    if (newPass !== confirm){ document.getElementById('passError').textContent='Passwords do not match.'; document.getElementById('passError').classList.remove('hidden'); return; }
    setLoading(btn, true);
    const res = await AuthAPI.resetPassword({ email: resetEmail, code, new_password: newPass });
    setLoading(btn, false);
    if (res.ok) { showToast('Password reset! Redirecting…', 'success'); setTimeout(() => window.location.href='login.html', 1000); }
    else { document.getElementById('codeError').textContent=res.data.message||'Invalid or expired code.'; document.getElementById('codeError').classList.remove('hidden'); }
  });
</script>
</body>
</html>
